<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>First Chair Prep</title>
<meta name="description" content="10-week ski conditioning plan with daily workouts and progress tracking.">
<meta name="theme-color" content="#EEF2F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C131D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="First Chair">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: trail-map app. Sticky header with countdown + phase timeline, tab bar, one working view at a time. */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --sunk:#E3E9F0; --fg:#142033; --muted:#55647A; --line:#D3DCE7;
  --accent:#0E5BB5; --accent-fg:#FFFFFF; --done:#0E5BB5; --done-soft:#D6E5F7;
  --str:#2456A6; --pow:#C8741F; --car:#C2364A; --bal:#0F8579; --mob:#7650B5;
  --green:#2E8B57; --blue:#1D5FC2; --black:#142033;
  --ph-onramp:#B9CCE3; --ph-base:#7FA6D6; --ph-deload:#CBD6E4; --ph-build:#3A6DB8; --ph-peak:#173D78; --ph-taper:#97B4DA;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C131D; --surface:#141F2E; --sunk:#0F1925; --fg:#E5EBF3; --muted:#93A1B6; --line:#24334A;
  --accent:#5B9BEF; --accent-fg:#0C131D; --done:#5B9BEF; --done-soft:#1B3354;
  --str:#6E9BEA; --pow:#EFA457; --car:#EE6F80; --bal:#41BFAF; --mob:#AA8CE8;
  --green:#4FBF7F; --blue:#5B9BEF; --black:#E5EBF3;
  --ph-onramp:#2B3E57; --ph-base:#3C5F8E; --ph-deload:#26364B; --ph-build:#5584CC; --ph-peak:#8FB6EE; --ph-taper:#46689A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C131D; --surface:#141F2E; --sunk:#0F1925; --fg:#E5EBF3; --muted:#93A1B6; --line:#24334A;
  --accent:#5B9BEF; --accent-fg:#0C131D; --done:#5B9BEF; --done-soft:#1B3354;
  --str:#6E9BEA; --pow:#EFA457; --car:#EE6F80; --bal:#41BFAF; --mob:#AA8CE8;
  --green:#4FBF7F; --blue:#5B9BEF; --black:#E5EBF3;
  --ph-onramp:#2B3E57; --ph-base:#3C5F8E; --ph-deload:#26364B; --ph-build:#5584CC; --ph-peak:#8FB6EE; --ph-taper:#46689A;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
button.sync{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer}
button.sync.warn{border-color:var(--pow)}
.acct{max-width:520px;margin-top:20px;padding:20px}
.acct h2{font-size:28px;margin-bottom:8px}
.acct p{margin:0 0 12px}
.acct form{display:grid;gap:10px;margin-top:8px}
.acct input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.acct .err{color:var(--car);font-size:14px}
.acct dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 16px;font-size:14px}
.acct dt{color:var(--muted)}.acct dd{margin:0;min-width:0;overflow-wrap:anywhere}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);}
.wrap{max-width:1040px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:16px 10px}
.brand h1{font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.count{display:flex;align-items:baseline;gap:8px}
.count b{font:700 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.count span{color:var(--muted);font-size:13px;max-width:12ch;line-height:1.2}
.timeline{position:relative;display:flex;height:22px;border-radius:5px;overflow:hidden;margin-block:4px 6px}
.timeline div{display:flex;align-items:center;justify-content:center;font:600 11px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--fg);white-space:nowrap;overflow:hidden;min-width:0}
.timeline .ph-build,.timeline .ph-peak{color:#fff}
:root[data-theme="dark"] .timeline .ph-peak{color:#0C131D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .timeline .ph-peak{color:#0C131D}}
.marker{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--car);border-radius:2px}
.tabs{display:flex;gap:4px;padding-block:6px 10px;overflow-x:auto}
.tabs button{border:1px solid transparent;background:none;padding:6px 14px;border-radius:999px;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.sync{margin-left:auto;align-self:center;font-size:12px;color:var(--muted);white-space:nowrap;padding-left:8px}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;margin-top:20px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* trail rating icons */
.rate{display:inline-block;width:12px;height:12px;flex:none}
.rate.green{border-radius:50%;background:var(--green)}
.rate.blue{background:var(--blue)}
.rate.black{background:var(--black);transform:rotate(45deg) scale(.82)}
.rate.dbl{width:22px;height:12px;background:none;position:relative}
.rate.dbl::before,.rate.dbl::after{content:"";position:absolute;top:0;width:12px;height:12px;background:var(--black);transform:rotate(45deg) scale(.72)}
.rate.dbl::before{left:-1px}.rate.dbl::after{left:9px}

/* today */
.dayhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:8px;font-size:18px;line-height:1}
.nav:disabled{opacity:.35;cursor:default}
.dayhd .date{font:600 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;min-width:10ch}
.todaybtn{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;font-size:13px}
.session{padding:20px}
.session h2{font-size:34px;margin-top:10px}
.session .focus{color:var(--muted);margin:6px 0 14px;max-width:62ch}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--done);border-radius:99px;transition:width .25s}
.mrow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
ul.exs{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
li.cdhd{padding-block:14px 6px;border-bottom:1px solid var(--line)}
li.cdhd .eyebrow{color:var(--mob)}
li.ex{border-bottom:1px solid var(--line);display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 12px;padding-block:12px}
.tick{width:28px;height:28px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.tick svg{width:16px;height:16px;opacity:0}
.tick[aria-checked="true"]{background:var(--done);border-color:var(--done)}
.tick[aria-checked="true"] svg{opacity:1}
.exmain{min-width:0}
.exname{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.cat{width:8px;height:8px;border-radius:2px;flex:none}
.c-str{background:var(--str)}.c-pow{background:var(--pow)}.c-car{background:var(--car)}.c-bal{background:var(--bal)}.c-mob{background:var(--mob)}
li.ex.isdone .exname span.nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.dose{font:500 13px/1.4 var(--f-mono);color:var(--fg);margin-top:2px}
.dose em{font-style:normal;color:var(--muted)}
details.why{margin-top:6px}
details.why summary{cursor:pointer;font-size:13px;color:var(--accent);list-style:none;display:inline-flex;gap:4px;align-items:center}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"+";font-family:var(--f-mono)}
details.why[open] summary::before{content:"–"}
.whybody{margin-top:8px;padding:12px 14px;background:var(--sunk);border-radius:8px;font-size:14px;max-width:68ch}
.whybody p{margin:0 0 8px}
.whybody h4{margin:0 0 4px;font:600 11px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.srcs{font-size:12.5px;color:var(--muted);margin:0;padding-left:18px}
.srcs li{margin-bottom:3px}
.log{display:grid;gap:12px;margin-top:18px}
.log label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.rpe{display:flex;gap:4px;flex-wrap:wrap}
.rpe button{width:34px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:13px}
.rpe button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;padding:8px 10px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:8px 14px;font-weight:500}
.btn.ghost{background:none;color:var(--fg);border-color:var(--line)}
aside .panel{padding:18px}
aside h3{font-size:22px;margin:6px 0 8px}
aside p{margin:0 0 10px;font-size:14px}
aside .stack{display:flex;flex-direction:column;gap:16px}
.legend{display:grid;gap:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}

/* calendar */
.months{display:grid;gap:24px;margin-top:20px}
.month h2{font-size:24px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 2px}
.cell{min-height:84px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;position:relative;overflow:hidden}
.cell.off{background:transparent;border-style:dashed;opacity:.45;cursor:default}
.cell.blank{visibility:hidden}
.cell .n{display:flex;justify-content:space-between;align-items:center;font:500 12px/1 var(--f-mono)}
.cell .lb{font-size:12px;line-height:1.25;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.cell .bar{margin-top:auto;height:5px;border-radius:99px;background:var(--sunk);overflow:hidden}
.cell .bar i{display:block;height:100%;background:var(--done)}
.cell.full{background:var(--done-soft);border-color:var(--done)}
.cell.full .lb{color:var(--fg)}
.cell.today{box-shadow:inset 0 0 0 2px var(--car)}
.cell.sel{outline:2px solid var(--fg);outline-offset:1px}
.cell.goal{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cell.goal .lb{color:var(--bg)}
@media (max-width:560px){.cell{min-height:58px;padding:4px}.cell .lb{display:none}.cal{gap:3px}}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{padding:14px 16px}
.tile b{display:block;font:700 34px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.chart{padding:18px;margin-top:16px}
.chart h3{font-size:22px}
.chart p.sub{margin:2px 0 10px;color:var(--muted);font-size:13px}
.svgwrap{overflow-x:auto}
.svgwrap svg{display:block;width:100%;min-width:520px;height:auto}
.svgwrap svg text{fill:var(--muted);font:11px var(--f-mono)}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.catrows{display:grid;gap:10px;margin-top:6px}
.catrow{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.catrow .track{height:12px;background:var(--sunk);border-radius:99px;overflow:hidden}
.catrow .track i{display:block;height:100%;border-radius:99px}
@media (max-width:480px){.catrow{grid-template-columns:90px minmax(0,1fr) 80px}}

/* science */
.sci{margin-top:20px;display:grid;gap:20px}
.intro{padding:20px;max-width:none}
.intro p{max-width:70ch;margin:8px 0 0}
.principles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.principles{grid-template-columns:minmax(0,1fr)}}
.pr{padding:16px}
.pr h3{font-size:20px;margin-bottom:6px}
.pr p{margin:0 0 8px;font-size:14px}
.phasetbl{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.phasetbl th,.phasetbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.phasetbl th{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.phasetbl td:first-child{white-space:nowrap}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.tblwrap{overflow-x:auto}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.filters button[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.lib{grid-template-columns:minmax(0,1fr)}}
.libitem{padding:14px 16px}
.libitem h4{margin:0 0 6px;display:flex;gap:8px;align-items:center;font-size:15px}
.libitem p{margin:0 0 6px;font-size:14px}
.libitem .lbl{font:600 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin:8px 0 3px}
a.yt{font:500 13px var(--f-body);color:var(--accent);text-decoration:none;white-space:nowrap}
a.yt:hover{text-decoration:underline}
.refs{font-size:13.5px;padding-left:20px;margin:0}
.refs li{margin-bottom:6px}
.sechd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sechd h2{font-size:26px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="hd">
      <div class="brand">
        <h1>First Chair Prep</h1>
        <p>Oct 8 → Dec 15, 2026 · 6 phases · full gym</p>
      </div>
      <button class="sync" id="sync" data-view="acct">Loading…</button>
      <div class="count"><b id="countdown">–</b><span id="countlabel">days to first chair</span></div>
    </div>
    <div class="timeline" id="timeline" aria-label="Plan phases"></div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-today" data-view="today">Day</button>
      <button role="tab" id="tab-cal" data-view="cal">Calendar</button>
      <button role="tab" id="tab-prog" data-view="prog">Progress</button>
      <button role="tab" id="tab-sci" data-view="sci">The science</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ---------------- sources ---------------- */
const S = {
  turnbull2009:["Turnbull, Kilding & Keogh 2009","Physiology of alpine skiing. Scand J Med Sci Sports 19(2):146–155."],
  hydren2013:["Hydren et al. 2013","Review of strength and conditioning for alpine ski racing. Strength Cond J 35(1):10–28."],
  ferguson2010:["Ferguson 2010","Limitations to performance during alpine skiing. Exp Physiol 95(3):404–410."],
  lauersen2014:["Lauersen, Bertelsen & Andersen 2014","The effectiveness of exercise interventions to prevent sports injuries: a systematic review and meta-analysis of randomised controlled trials. Br J Sports Med 48(11):871–877."],
  webster2018:["Webster & Hewett 2018","Meta-analysis of meta-analyses of anterior cruciate ligament injury reduction training programs. J Orthop Res 36(10):2696–2708."],
  hubscher2010:["Hübscher et al. 2010","Neuromuscular training for sports injury prevention: a systematic review. Med Sci Sports Exerc 42(3):413–421."],
  raschner2012:["Raschner et al. 2012","The relationship between ACL injuries and physical fitness in young competitive ski racers: a 10-year longitudinal study. Br J Sports Med 46(15):1065–1071."],
  vogt2014:["Vogt & Hoppeler 2014","Eccentric exercise: mechanisms and effects when used as training regime or training adjunct. J Appl Physiol 116(11):1446–1454."],
  mchugh2003:["McHugh 2003","Recent advances in the understanding of the repeated bout effect: the protective effect against muscle damage from a single bout of eccentric exercise. Scand J Med Sci Sports 13(2):88–97."],
  schoenfeld2017:["Schoenfeld, Ogborn & Krieger 2017","Dose-response relationship between weekly resistance training volume and increases in muscle mass: a systematic review and meta-analysis. J Sports Sci 35(11):1073–1082."],
  helms2016:["Helms et al. 2016","Application of the repetitions in reserve-based rating of perceived exertion scale for resistance training. Strength Cond J 38(4):42–49."],
  markovic2007:["Markovic 2007","Does plyometric training improve vertical jump height? A meta-analytical review. Br J Sports Med 41(6):349–355."],
  devillarreal2009:["de Villarreal et al. 2009","Determining variables of plyometric training for improving vertical jump height performance: a meta-analysis. J Strength Cond Res 23(2):495–506."],
  milanovic2015:["Milanović, Sporiš & Weston 2015","Effectiveness of high-intensity interval training (HIT) and continuous endurance training for VO2max improvements: a systematic review and meta-analysis of controlled trials. Sports Med 45(10):1469–1481."],
  seiler2010:["Seiler 2010","What is best practice for training intensity and duration distribution in endurance athletes? Int J Sports Physiol Perform 5(3):276–291."],
  wilson2012:["Wilson et al. 2012","Concurrent training: a meta-analysis examining interference of aerobic and resistance exercises. J Strength Cond Res 26(8):2293–2307."],
  ronnestad2014:["Rønnestad & Mujika 2014","Optimizing strength training for running and cycling endurance performance: a review. Scand J Med Sci Sports 24(4):603–612."],
  behm2016:["Behm et al. 2016","Acute effects of muscle stretching on physical performance, range of motion, and injury incidence in healthy active individuals: a systematic review. Appl Physiol Nutr Metab 41(1):1–11."],
  wiewelhove2019:["Wiewelhove et al. 2019","A meta-analysis of the effects of foam rolling on performance and recovery. Front Physiol 10:376."],
  haroy2019:["Harøy et al. 2019","The Adductor Strengthening Programme prevents groin problems among male football players: a cluster-randomised controlled trial. Br J Sports Med 53(3):150–157."],
  vanderhorst2015:["van der Horst et al. 2015","The preventive effect of the Nordic hamstring exercise on hamstring injuries in amateur soccer players: a randomized controlled trial. Am J Sports Med 43(6):1316–1323."],
  vandyk2019:["van Dyk, Behan & Whiteley 2019","Including the Nordic hamstring exercise in injury prevention programmes halves the rate of hamstring injuries: a systematic review and meta-analysis. Br J Sports Med 53(21):1362–1370."],
  bosquet2007:["Bosquet et al. 2007","Effects of tapering on performance: a meta-analysis. Med Sci Sports Exerc 39(8):1358–1365."],

const CATS = {str:"Strength",pow:"Power",car:"Cardio",bal:"Balance & core",mob:"Mobility"};
const E = {
 warmup:{n:"Dynamic warm-up",c:"mob",how:"5 min easy bike or row. Then leg swings, walking lunges with reach, lateral shuffles and 5 bodyweight squats. Go a little faster each set.",why:"A dynamic warm-up raises muscle temperature and prepares the nervous system. It does not reduce power. Long static holds (more than 60 s per muscle) before jumps can reduce power a small amount, so the long holds in this plan come at the end of a session.",s:["behm2016"]},
 backsquat:{n:"Back squat",c:"str",how:"Bar on the upper back, feet about shoulder width. Sit down between the hips to parallel or lower. Keep the knees in line with the toes. When the dose says “3 s lower”, take 3 seconds on the way down.",why:"Skiing loads the quads and glutes in long eccentric and isometric contractions. Heavy squats raise your maximum force, so each turn uses a smaller part of it and you tire later. Strength training also prevents injury: a meta-analysis of trials found it cut sports injuries to less than one third.",s:["hydren2013","lauersen2014"]},

 slrdl:{n:"Single-leg RDL",c:"str",how:"Dumbbell in the opposite hand. Hinge on one leg until the torso is near parallel to the floor. Keep the hips level.",why:"It trains hamstring strength and hip stability on one leg at the same time. Hip control limits knee collapse when a ski catches an edge.",s:["hubscher2010","hydren2013"]},
 laterallunge:{n:"Lateral lunge",c:"str",how:"Hold a kettlebell at the chest. Step wide to one side and sit back into that hip, other leg straight. Push back to the start.",why:"Skiing works side to side (the frontal plane). This loads the adductors and glutes through the range you use in wide stances and recoveries.",s:["hydren2013"]},
 nordic:{n:"Nordic hamstring curl",c:"str",how:"Kneel with the ankles held by a partner or a pad. Lower the torso forward as slowly as you can. Catch yourself with your hands and push back up.",why:"In trials, programs with Nordic curls cut hamstring injuries by about half. Start with low volume, because the first sessions cause strong soreness.",s:["vanderhorst2015","vandyk2019"]},
 copenhagen:{n:"Copenhagen plank",c:"str",how:"Side plank with the top leg on a bench (knee for easier, ankle for harder). Lift the hips and hold.",why:"Adductor strength protects the groin. A program built on this exercise reduced groin problems by about 41% in a randomised trial. Skiers use the adductors to hold the skis together and resist a split.",s:["haroy2019"]},
 calf:{n:"Single-leg calf raise",c:"str",how:"Stand on one leg on a step. Lower the heel fully, then rise high. Pause 1 s at the top.",why:"The boot limits the ankle, but the calves and feet still control fore-aft balance. Strong calves also help you land the jumps in this plan.",s:["hydren2013"]},
 pullup:{n:"Pull-up",c:"str",how:"Full hang to chin over the bar. Use a band if needed. Add weight when you can do all reps with 2 left in reserve.",why:"Upper-body strength helps with pole plants, carrying gear and falls. It keeps the program balanced, and balanced strength programs have fewer overuse injuries.",s:["lauersen2014","helms2016"]},
 press:{n:"Dumbbell bench press",c:"str",how:"Lie on a bench. Lower the dumbbells to chest level with elbows at about 45°. Press up.",why:"Pressing strength helps you push up out of deep snow and protects the shoulders in a fall.",s:["lauersen2014"]},

 landmine:{n:"Half-kneeling landmine press",c:"str",how:"One knee down. Press the bar up and forward with the hand on the side of the down knee. Keep the ribs down.",why:"It trains the shoulder and resists trunk rotation at the same time, which links upper body and core.",s:["raschner2012"]},
 pallof:{n:"Pallof press",c:"bal",how:"Stand side-on to a cable at chest height. Press the handle straight out and hold 2 s. Do not let the torso turn.",why:"Skiing needs a stiff trunk while the legs turn under you. In a 10-year study of young ski racers, those with less core strength had more ACL injuries. Anti-rotation work trains this stiffness.",s:["raschner2012"]},

 latbound:{n:"Lateral bound (skater)",c:"pow",how:"Jump sideways from one leg to the other. Land soft. Stick the landing when the dose says so. Knee stays over the foot.",why:"It trains side-to-side power and single-leg landing control, which match the edge-to-edge movement of a turn.",s:["markovic2007","hubscher2010"]},
 boxjump:{n:"Box jump",c:"pow",how:"Jump onto a box of knee to mid-thigh height. Land soft. Step down, do not jump down. Rest fully between reps.",why:"Meta-analyses show plyometric training raises jump height by about 5–10%. Power helps you recover from mistakes and absorb terrain.",s:["markovic2007","devillarreal2009"]},
 depthjump:{n:"Depth drop to jump",c:"pow",how:"Step off a 30 cm box. Land and jump up at once with short ground contact. Stop the set if the landing gets loud or the knees move in.",why:"It trains the fast switch from absorbing force to producing it. You use this quality in moguls and on uneven snow.",s:["devillarreal2009"]},
 slalomhop:{n:"Lateral line hops",c:"pow",how:"Feet together. Hop side to side over a line, fast but in control. Keep the upper body quiet and facing forward.",why:"This is close to quick short-radius turns. It trains foot speed and fast edge changes while the upper body stays still.",s:["hydren2013"]},
 medball:{n:"Rotational med-ball throw",c:"pow",how:"Stand side-on to a wall. Turn from the hips and throw a 3–5 kg ball into the wall. Catch and repeat.",why:"It trains power through the hips and trunk and balances all the anti-rotation work.",s:["hydren2013"]},
 skirun:{n:"Ski-run circuit",c:"pow",how:"One round, no rest inside: 30 s wall sit at ski-stance depth → 20 s lateral line hops → 20 s lateral bounds → 20 s wall sit. Rest as given between rounds.",why:"A hard ski run lasts about 30–120 s with the quads under constant load. Long isometric contractions also limit blood flow to the quads, which is why they burn. This circuit trains that mix of high quad load and fast footwork.",s:["turnbull2009","ferguson2010"]},
 intervals:{n:"Intervals",c:"car",how:"Bike, rower or ski erg. “Hard” means you can only say a few words. “Easy” means slow spinning or rowing. Use the bike or rower here, not running.",why:"High-intensity intervals raise VO2max more than steady work alone. Ski runs are short and hard, and you recover on the lift with your aerobic system. Cycling interferes less with leg strength gains than running does.",s:["milanovic2015","wilson2012"]},
 z2:{n:"Zone 2 cardio",c:"car",how:"Bike, incline walk, rower or hike. Easy pace: you can speak in full sentences and breathe through the nose. About 60–70% of max heart rate.",why:"Endurance athletes do most of their training at low intensity. A strong aerobic base speeds recovery between runs and helps you ski full days. Easy work adds fitness with little extra fatigue.",s:["seiler2010","turnbull2009"]},
 walk:{n:"Easy walk or hike",c:"car",how:"Outdoor walk or easy hike. Conversational pace. No heart rate target.",why:"Light movement on a recovery day adds aerobic volume with almost no stress. Recovery is when the body adapts to the training load.",s:["soligard2016"]},
 couch:{n:"Couch stretch",c:"mob",how:"Back knee on a pad against a wall or bench, shin up the wall, front foot forward. Squeeze the glute of the back leg. Hold.",why:"Long hours in a flexed ski stance tighten the hip flexors. Static stretching increases range of motion. Do it after training, not before jumps.",s:["behm2016"]},
 hip9090:{n:"90/90 hip switches",c:"mob",how:"Sit with both knees bent to 90°, one in front and one to the side. Rotate the knees to the other side without using the hands if you can.",why:"It trains hip internal and external rotation, which you need to steer the skis from the hips.",s:["behm2016"]},
 ankle:{n:"Knee-to-wall ankle mobility",c:"mob",how:"Foot a few cm from a wall. Drive the knee forward to touch the wall without lifting the heel. Move the foot back as you improve.",why:"Ski boots hold the shin forward. Good ankle range lets you get into a deep, balanced stance and land jumps with the knees over the toes.",s:["behm2016"]},
 tspine:{n:"Open-book rotation",c:"mob",how:"Lie on your side, knees bent. Open the top arm across to the floor behind you. Follow the hand with your eyes.",why:"Upper-back rotation lets the upper body stay facing downhill while the legs turn under it.",s:["behm2016"]},
 pigeon:{n:"Pigeon stretch",c:"mob",how:"Front shin across the body, back leg straight behind. Fold forward slowly. Hold.",why:"It stretches the glutes and deep hip rotators after heavy leg work. Stretching improves range of motion but does little to prevent injury on its own, so it supports the strength work and does not replace it.",s:["behm2016","lauersen2014"]},
 hamstrap:{n:"Strap hamstring stretch",c:"mob",how:"Lie on your back. Loop a strap around one foot and raise the straight leg until you feel a stretch. Keep the other leg flat. Hold and breathe slowly.",why:"Hamstrings get tight after squats, RDLs and Nordic curls. Static stretching after training increases range of motion, which helps you hold a balanced hip hinge in the ski stance.",s:["behm2016"]},

 latstretch:{n:"Child's pose lat stretch",c:"mob",how:"Kneel, sit back on the heels and reach the arms forward on the floor. Walk the hands to one side to stretch the opposite lat.",why:"Pull-ups and rows tighten the lats. Tight lats can limit overhead reach and pull the lower back into extension.",s:["behm2016"]},

   it("walk",p.walk+" min",p.walk),
   cd("hip9090","2 × 6 /side",3),cd("couch","2 × 45 s /side",4),cd("hamstrap","2 × 45 s /side",3),cd("adductor","2 × 8 /side",3),cd("tspine","2 × 8 /side",3),cd("foamroll","8 min",8)]})
};
const WEEK=["recovery","lowerA","intervals","upper","lowerB","long","ski"]; // by getDay()
const ONRAMP={4:"lowerB",5:"long",6:"lowerA",0:"recovery"};

const planCache={};
function plan(s){
  if(planCache[s])return planCache[s];
  const k=phaseOf(s),p=PH[k],dow=parse(s).getDay();
  let d;
  if(s==="2026-12-14"){d={t:"Rest + travel",short:"Rest",r:"green",f:"No training. Pack, sleep, hydrate. A short walk and mobility only.",x:[
    it("walk","20 min",20),cd("ankle","2 × 10 /side",4),cd("hip9090","2 × 6 /side",4),cd("tspine","2 × 8 /side",3)]};}
  else if(s===END){d={t:"First chair",short:"Ski day",r:"green",f:"Goal day. Warm up before the first run and ski easy terrain for the first hour.",goal:true,x:[
    it("warmup","10 min at the base",10),it("snapdown","1 × 3",2),it("ankle","1 × 10 /side",2)]};}
  else{d=TPL[k==="onramp"?ONRAMP[dow]:WEEK[dow]](p);}
  if((k==="deload"||k==="taper")&&!d.goal&&s!=="2026-12-14"){
    const drop=["slrdl","laterallunge","landmine","suitcase","landhop","calf","medball","copenhagen"];
    d.x=d.x.filter(x=>!drop.includes(x.id)).map(x=>x.id==="z2"&&x.m===20?it("z2","10 min easy cool-down",10):x);
    if(k==="taper")d.x=d.x.filter(x=>!["bss","abwheel","deadbug"].includes(x.id));
  }
  if((k==="deload"||k==="taper"||k==="onramp")&&d.r==="black")d.r="blue";
  if((k==="build"||k==="peak")&&d.short==="Ski sim")d.r="dbl";
  d.phase=k;d.week=weekOf(s);d.total=d.x.reduce((a,b)=>a+b.m,0);
  return planCache[s]=d;
}

/* ---------------- state + sync (local first, Supabase when signed in) ---------------- */
const LS="firstchair.v1";
const state={view:"today",sel:null,log:{},pending:{},lib:"all",auth:{step:"email",email:"",err:"",busy:false}};
try{const c=JSON.parse(localStorage.getItem(LS)||"{}");if(c.log)state.log=c.log;if(c.pending)state.pending=c.pending;if(c.view&&c.view!=="acct")state.view=c.view;if(c.email)state.auth.email=c.email;}catch(e){}
function cache(){try{localStorage.setItem(LS,JSON.stringify({log:state.log,pending:state.pending,view:state.view==="acct"?"today":state.view,email:state.auth.email}))}catch(e){}}
let TODAY=ymd(new Date());
state.sel = TODAY<START?START:TODAY>END?END:TODAY;
function entry(s){return state.log[s]||{done:[],rpe:null,note:"",u:null}}

const CFG=window.FIRST_CHAIR_CONFIG||{};
const configured=!!(window.supabase&&CFG.supabaseUrl&&CFG.supabaseAnonKey&&!/YOUR-/.test(CFG.supabaseUrl+CFG.supabaseAnonKey));
const sb=configured?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}}):null;
let user=null,syncing=false,again=false,syncErr="",lastSync=null,pushTimer=null;

function save(s){
  const e={...entry(s)};e.u=new Date().toISOString();state.log[s]=e;
  state.pending[s]=e.u;cache();setSync();
  clearTimeout(pushTimer);pushTimer=setTimeout(sync,800);
}
async function sync(){
  if(!sb||!user||!navigator.onLine){setSync();return;}
  if(syncing){again=true;return;}
  syncing=true;syncErr="";setSync();
  try{
    const days=Object.keys(state.pending);
    if(days.length){
      const rows=days.map(d=>{const e=entry(d);return {user_id:user.id,day:d,done:e.done,rpe:e.rpe,note:e.note||"",updated_at:e.u||new Date().toISOString()}});
      const {error}=await sb.from("workout_log").upsert(rows,{onConflict:"user_id,day"});
      if(error)throw error;
      rows.forEach(r=>{if(state.pending[r.day]===r.updated_at)delete state.pending[r.day];});
    }
    const {data,error}=await sb.from("workout_log").select("day,done,rpe,note,updated_at");
    if(error)throw error;
    (data||[]).forEach(r=>{
      if(state.pending[r.day])return;
      const l=state.log[r.day];
      if(!l||!l.u||Date.parse(r.updated_at)>=Date.parse(l.u))state.log[r.day]={done:r.done||[],rpe:r.rpe,note:r.note||"",u:r.updated_at};
    });
    lastSync=new Date();
  }catch(e){syncErr=e.message||String(e);}
  syncing=false;cache();setSync();render();
  if(again){again=false;sync();}
}
function setSync(){
  const el=document.getElementById("sync");if(!el)return;
  const n=Object.keys(state.pending).length;let t,warn=false;
  if(!sb){t="This device only";}
  else if(!user){t="Sign in to sync";warn=true;}
  else if(!navigator.onLine){t=n?`Offline · ${n} to sync`:"Offline";}
  else if(syncing){t="Syncing…";}
  else if(syncErr){t="Sync error";warn=true;}
  else{t=n?`${n} to sync`:"Synced";}
  el.textContent=t;el.classList.toggle("warn",warn);
}
if(sb){
  sb.auth.getSession().then(({data})=>{user=data.session?data.session.user:null;setSync();if(user)sync();});
  sb.auth.onAuthStateChange((ev,session)=>{user=session?session.user:null;setSync();if(user)setTimeout(sync,0);if(state.view==="acct")setTimeout(render,0);});
}
window.addEventListener("online",sync);window.addEventListener("offline",setSync);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;const t=ymd(new Date());if(t!==TODAY){TODAY=t;render();}sync();});

/* ---------------- account view ---------------- */
const esc=v=>String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function renderAcct(){
  const A=state.auth,n=Object.keys(state.pending).length;
  if(!sb)return `<div class="panel acct"><h2>Sync is not set up</h2><p>Your progress saves on this device only. To sync across devices, add your Supabase project URL and anon key to <span class="mono">config.js</span> and deploy again.</p></div>`;
  if(user)return `<div class="panel acct"><h2>Sync</h2><dl><dt>Signed in</dt><dd>${esc(user.email||"")}</dd><dt>Last sync</dt><dd>${lastSync?lastSync.toLocaleTimeString():"Not yet"}</dd><dt>Waiting</dt><dd>${n} day${n===1?"":"s"}</dd>${syncErr?`<dt>Error</dt><dd class="err">${esc(syncErr)}</dd>`:""}</dl>
    <div class="actions"><button class="btn" data-act="syncnow">Sync now</button><button class="btn ghost" data-act="signout">Sign out</button></div></div>`;
  if(A.step==="code")return `<div class="panel acct"><h2>Enter your code</h2><p>We sent a code to <b>${esc(A.email)}</b>. It can take a minute. Check spam if you do not see it.</p>

  return `<div class="panel acct"><h2>Sign in to sync</h2><p>Your progress saves on this device now. Sign in to keep it in sync on your phone and laptop. We email you a one-time code. You do not need a password.</p>
    <form id="emailform"><label for="email" class="eyebrow">Email</label><input id="email" type="email" autocomplete="email" required value="${esc(A.email)}">
    ${A.err?`<span class="err">${esc(A.err)}</span>`:""}<div class="actions"><button class="btn" type="submit" ${A.busy?"disabled":""}>${A.busy?"Sending…":"Email me a code"}</button></div></form></div>`;
}
document.addEventListener("submit",async e=>{
  const f=e.target;if(f.id!=="emailform"&&f.id!=="codeform")return;
  e.preventDefault();const A=state.auth;A.err="";A.busy=true;
  if(f.id==="emailform"){
    A.email=document.getElementById("email").value.trim();cache();render();
    const {error}=await sb.auth.signInWithOtp({email:A.email});
    A.busy=false;if(error)A.err=error.message;else A.step="code";render();
    if(!error)setTimeout(()=>{const i=document.getElementById("otp");if(i)i.focus();},50);
  }else{
    const token=document.getElementById("otp").value.trim();render();
    const {error}=await sb.auth.verifyOtp({email:A.email,token,type:"email"});
    A.busy=false;if(error){A.err=error.message;render();}else{A.step="email";state.view="today";render();}
  }
});

/* ---------------- derived ---------------- */
function pct(s){const p=plan(s),e=entry(s);const n=p.x.filter(x=>e.done.includes(x.id)).length;return {n,of:p.x.length,f:n/p.x.length}}
function doneMin(s){const p=plan(s),e=entry(s);const o={str:0,pow:0,car:0,bal:0,mob:0};p.x.forEach(x=>{if(e.done.includes(x.id))o[E[x.id].c]+=x.m});return o}
function planMin(s){const o={str:0,pow:0,car:0,bal:0,mob:0};plan(s).x.forEach(x=>o[E[x.id].c]+=x.m);return o}

  document.querySelectorAll(".tabs [role=tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===state.view));

const srcList=ids=>`<ol class="srcs">${ids.map(id=>`<li><a href="${scholar(id)}" target="_blank" rel="noopener">${S[id][0]}</a>. ${S[id][1]}</li>`).join("")}</ol>`;

function renderDay(){

}

/* ---------------- render: progress ---------------- */
function renderProg(){
  const past=ALL.filter(s=>s<=TODAY);
  let exDone=0,exPlan=0,full=0,mins=0;
  past.forEach(s=>{const c=pct(s);exDone+=c.n;exPlan+=c.of;if(c.f===1)full++;});
  ALL.forEach(s=>{mins+=Object.values(doneMin(s)).reduce((a,b)=>a+b,0)});
  let streak=0;{let s=TODAY>END?END:TODAY;if(s>=START&&pct(s).f<1)s=addDays(s,-1);while(s>=START&&pct(s).f===1){streak++;s=addDays(s,-1);}}
  const rpes=ALL.map(s=>entry(s).rpe).filter(Boolean);
  const tiles=[[full+" / "+past.length,"days fully done so far"],[(exPlan?Math.round(exDone/exPlan*100):0)+"%","of exercises done to date"],[streak,streak===1?"day streak":"day streak"],[(mins/60).toFixed(1)+" h","trained in total"]];

  // weekly stacked bars
  const weeks=[];for(let w=0;w<=9;w++)weeks.push({w,done:{str:0,pow:0,car:0,bal:0,mob:0},plan:0,start:null});
  ALL.forEach(s=>{const W=weeks[weekOf(s)];if(!W.start)W.start=s;const d=doneMin(s);for(const k in d)W.done[k]+=d[k];W.plan+=Object.values(planMin(s)).reduce((a,b)=>a+b,0);});
  const maxV=Math.max(...weeks.map(w=>w.plan)),top=Math.ceil(maxV/120)*120;
  const Wd=640,H=240,L=44,R=8,T=12,B=34,iw=Wd-L-R,ih=H-T-B,bw=iw/weeks.length;
  const y=v=>T+ih-(v/top)*ih;
  let g="";for(let v=0;v<=top;v+=120){g+=`<line x1="${L}" x2="${Wd-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v/60}h</text>`;}
  const order=["str","pow","bal","car","mob"];
  weeks.forEach((W,i)=>{const x=L+i*bw+bw*.18,w=bw*.64;
    g+=`<rect x="${x}" y="${y(W.plan)}" width="${w}" height="${ih-(y(W.plan)-T)}" fill="none" stroke="var(--muted)" stroke-dasharray="3 3" rx="3"/>`;
    let acc=0;order.forEach(k=>{const v=W.done[k];if(!v)return;g+=`<rect x="${x}" y="${y(acc+v)}" width="${w}" height="${(v/top)*ih}" fill="var(--${k})"><title>Week ${W.w} · ${CATS[k]}: ${v} min</title></rect>`;acc+=v;});
    const d=parse(W.start);g+=`<text x="${x+w/2}" y="${H-18}" text-anchor="middle">W${W.w}</text><text x="${x+w/2}" y="${H-5}" text-anchor="middle">${d.getMonth()+1}/${d.getDate()}</text>`;});
  // marker for current week
  if(TODAY>=START&&TODAY<=END){const i=weekOf(TODAY);g+=`<rect x="${L+i*bw+2}" y="${T}" width="${bw-4}" height="${ih}" fill="var(--accent)" opacity=".07" rx="4"/>`;}

  // heatmap
  const cw=40,chh=24,hx=40,hy=20;let hm="";
  ["M","T","W","T","F","S","S"].forEach((d,i)=>hm+=`<text x="${hx+i*cw+cw/2-2}" y="12" text-anchor="middle">${d}</text>`);
  for(let w=0;w<=10;w++){
    const mon=addDays("2026-10-05",w*7);if(mon>END)break;
    hm+=`<text x="${hx-8}" y="${hy+w*chh+16}" text-anchor="end">${parse(mon).getMonth()+1}/${parse(mon).getDate()}</text>`;
    for(let i=0;i<7;i++){const s=addDays(mon,i);if(s<START||s>END)continue;const f=pct(s).f,fut=s>TODAY;
      hm+=`<rect x="${hx+i*cw+2}" y="${hy+w*chh+2}" width="${cw-4}" height="${chh-4}" rx="4" fill="${f>0?"var(--done)":"var(--sunk)"}" fill-opacity="${f>0?(.25+.75*f).toFixed(2):1}" ${fut&&f===0?'stroke="var(--line)" stroke-dasharray="2 2"':""} ${s===TODAY?'stroke="var(--car)" stroke-width="2"':""}><title>${fmt(s)}: ${Math.round(f*100)}%</title></rect>`;}
  }
  const hmH=hy+11*chh;

  // category totals
  const ct={str:[0,0],pow:[0,0],car:[0,0],bal:[0,0],mob:[0,0]};
  ALL.forEach(s=>{const d=doneMin(s),p=planMin(s);for(const k in d){ct[k][0]+=d[k];ct[k][1]+=p[k];}});

  return `<div class="tiles">${tiles.map(([b,t])=>`<div class="panel tile"><b>${b}</b><span>${t}</span></div>`).join("")}</div>
  <div class="grid2" style="margin-top:0">
    <div class="panel chart"><h3>Training minutes by week</h3><p class="sub">Solid bars are done. Dashed outline is the plan. Shaded column is this week.</p>
      <div class="svgwrap"><svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Weekly minutes done by category">${g}</svg></div>
      <div class="keys">${order.map(k=>`<span><i class="cat c-${k}"></i>${CATS[k]}</span>`).join("")}</div></div>
    <div class="panel chart"><h3>Consistency</h3><p class="sub">Each square is one day. Darker means more of the day done.</p>
      <div class="svgwrap"><svg viewBox="0 0 ${hx+7*cw+4} ${hmH}" style="min-width:300px;max-width:420px" role="img" aria-label="Daily completion heatmap">${hm}</svg></div></div>
  </div>
  <div class="panel chart"><h3>Plan coverage by type</h3><p class="sub">Minutes done out of minutes planned for the whole program.${rpes.length?` Average session RPE so far: <span class="mono">${(rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1)}</span>.`:""}</p>
    <div class="catrows">${order.map(k=>`<div class="catrow"><span><i class="cat c-${k}" style="display:inline-block;margin-right:6px"></i>${CATS[k]}</span><div class="track"><i style="width:${ct[k][1]?ct[k][0]/ct[k][1]*100:0}%;background:var(--${k})"></i></div><span class="mono" style="text-align:right">${ct[k][0]} / ${ct[k][1]}</span></div>`).join("")}</div></div>`;
}

/* ---------------- render: science ---------------- */
const PRINCIPLES=[
 ["What skiing demands","Skiing loads the quads and glutes in long eccentric and near-isometric contractions. Runs last about 30–120 s and use both aerobic and anaerobic energy. Long isometric holds reduce blood flow to the quads, which causes the burn. The plan trains each of these qualities.",["turnbull2009","ferguson2010","hydren2013"]],
 ["Strength prevents injury","A meta-analysis of 25 trials found strength training cut sports injuries to less than one third. Stretching alone had no clear effect. This is why strength is the core of the plan and stretching supports it.",["lauersen2014"]],
 ["Train the knee to stay in line","Programs with landing drills, balance and strength work reduce ACL injuries. In a 10-year study of young ski racers, weaker core strength was linked to ACL injury. Every week has landing, balance and core work.",["webster2018","hubscher2010","raschner2012"]],
 ["Eccentric work and the repeated bout effect","Slow lowering builds the strength that skiing uses most. A first bout of eccentric work protects muscle from damage in later bouts. The on-ramp and base weeks use this so that your first ski days cause less soreness.",["vogt2014","mchugh2003"]],
 ["Mostly easy cardio, some hard","Endurance athletes do about 80% of training at low intensity and about 20% hard. Intervals raise VO2max. The plan has two to three easy sessions and one or two hard sessions per week.",["seiler2010","milanovic2015"]],
 ["Strength and cardio together","Cardio can reduce strength gains, mainly when it is running and high volume. Cycling interferes less. The plan puts intervals on the bike or rower, and keeps hard leg days apart.",["wilson2012","ronnestad2014"]],
 ["Plyometrics turn strength into power","Jump training improves jump height and power. It starts small (pogo hops, landings) and builds to box jumps and depth jumps after you have a strength base.",["markovic2007","devillarreal2009"]],
 ["Hamstrings and adductors","Nordic curls halve hamstring injuries. The Copenhagen plank program cut groin problems by about 41%. Both are low-time, high-return additions.",["vandyk2019","vanderhorst2015","haroy2019"]],
 ["Load, recovery and sleep","Injury risk rises with big jumps in load and with poor recovery. Sleep loss reduces performance. This is why the plan uses about 60–90 min on most days with a recovery day and a deload week, not 3 hours every day.",["soligard2016","fullagar2015"]],
 ["Taper to arrive fresh","Cutting volume by 41–60% for 8–14 days while keeping intensity gives the best performance gains. The taper starts Dec 7.",["bosquet2007"]],
 ["Stretch after, warm up before","Short dynamic warm-ups help performance. Long static holds before jumps can reduce power a little. Static stretching and foam rolling come after training or on recovery days.",["behm2016","wiewelhove2019"]],
 ["Effort by feel (RPE)","RPE based on reps in reserve lets you adjust loads to how you feel each day. It is a reliable way to guide strength training without testing your max.",["helms2016"]]
];
function renderSci(){
  const ids=Object.keys(E).filter(id=>state.lib==="all"||E[id].c===state.lib);
  return `<div class="sci">
  <div class="panel intro"><span class="eyebrow">How the plan works</span><h2 style="font-size:30px;margin-top:6px">Ten weeks, six phases</h2>
   <p>The plan runs from Oct 8 to Dec 15. It builds a base, rests for one week, gets heavy and explosive, turns ski-specific, and then tapers. Each day has one main goal, and every session ends with a mobility and stretching cool-down. Hard leg days are on Monday and Thursday, intervals on Tuesday, the ski simulation on Saturday, and Sunday is for recovery.</p>
   <p>You said you can train up to 3 hours a day. The plan uses about 30–110 minutes per day instead, and most days are 60–90. More time would add fatigue faster than fitness and raise injury risk. Use spare time for sleep, walking, and food.</p></div>
  <section><div class="sechd"><h2>Phases</h2></div>
   <div class="panel tblwrap" style="margin-top:8px"><table class="phasetbl"><thead><tr><th>Phase</th><th>Dates</th><th>Main lifts</th><th>Goal</th></tr></thead><tbody>
   ${PH_ORDER.map(k=>`<tr><td><i class="swatch" style="background:var(--ph-${k})"></i>${PH[k].name}</td><td class="mono">${MON[parse(PH[k].from).getMonth()]} ${parse(PH[k].from).getDate()} – ${MON[parse(PH[k].to).getMonth()]} ${parse(PH[k].to).getDate()}</td><td class="mono">${PH[k].main}</td><td>${PH[k].goal}</td></tr>`).join("")}
   </tbody></table></div></section>
  <section><div class="sechd"><h2>Principles</h2></div>
   <div class="principles" style="margin-top:8px">${PRINCIPLES.map(([t,p,s])=>`<div class="panel pr"><h3>${t}</h3><p>${p}</p>${srcList(s)}</div>`).join("")}</div></section>
  <section><div class="sechd"><h2>Exercise library</h2><span class="eyebrow">${ids.length} exercises</span></div>
   <div class="filters">${[["all","All"],...Object.entries(CATS)].map(([k,v])=>`<button data-lib="${k}" aria-pressed="${state.lib===k}">${k!=="all"?`<i class="cat c-${k}"></i>`:""}${v}</button>`).join("")}</div>
   <div class="lib">${ids.map(id=>{const x=E[id];return `<div class="panel libitem"><h4><i class="cat c-${x.c}"></i>${x.n}</h4><span class="lbl">How</span><p>${x.how}</p><span class="lbl">Why</span><p>${x.why}</p>${srcList(x.s)}${ytUrl(id)?`<p style="margin:8px 0 0">${ytLink(id)}</p>`:""}</div>`}).join("")}</div></section>
  <section><div class="sechd"><h2>References</h2></div>
   <div class="panel" style="padding:18px;margin-top:8px"><ol class="refs">${Object.keys(S).sort((a,b)=>S[a][0].localeCompare(S[b][0])).map(id=>`<li><a href="${scholar(id)}" target="_blank" rel="noopener">${S[id][0]}</a>. ${S[id][1]}</li>`).join("")}</ol>
   <p style="font-size:13px;color:var(--muted);margin:12px 0 0">This plan is general guidance, not medical advice. Stop any exercise that causes sharp pain and see a physician or physical therapist about it.</p></div></section>
  </div>`;
}

/* ---------------- render + events ---------------- */
const app=document.getElementById("app");
function render(){
  renderHeader();
  const openWhy=[...app.querySelectorAll("details.why[open]")].map(d=>d.closest("li")?.querySelector("[data-tick]")?.dataset.tick);
  const ae=document.activeElement;
  if(ae&&app.contains(ae)&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"))return; // do not re-render while typing
  app.innerHTML=state.view==="today"?renderDay():state.view==="cal"?renderCal():state.view==="prog"?renderProg():state.view==="acct"?renderAcct():renderSci();
  openWhy.forEach(id=>{const b=app.querySelector(`[data-tick="${id}"]`);if(b)b.closest("li").querySelector("details").open=true;});
}
document.querySelector("header.top").addEventListener("click",e=>{const b=e.target.closest("[data-view]");if(!b)return;state.view=b.dataset.view;cache();render();window.scrollTo(0,0);});
app.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const s=state.sel;
  if(t.dataset.tick){const en={...entry(s)};en.done=en.done.slice();const id=t.dataset.tick,i=en.done.indexOf(id);i>=0?en.done.splice(i,1):en.done.push(id);state.log[s]=en;save(s);render();return;}
  if(t.dataset.rpe){const en={...entry(s)};const n=+t.dataset.rpe;en.rpe=en.rpe===n?null:n;state.log[s]=en;save(s);render();return;}
  if(t.dataset.day){state.sel=t.dataset.day;state.view="today";cache();render();window.scrollTo(0,0);return;}
  if(t.dataset.lib){state.lib=t.dataset.lib;render();return;}
  const a=t.dataset.act;
  if(a==="prev"&&s>START){state.sel=addDays(s,-1);render();}
  if(a==="next"&&s<END){state.sel=addDays(s,1);render();}
  if(a==="today"){state.sel=TODAY;render();}
  if(a==="all"){state.log[s]={...entry(s),done:plan(s).x.map(x=>x.id)};save(s);render();}
  if(a==="syncnow"){sync();}
  if(a==="signout"){sb.auth.signOut().then(()=>{user=null;lastSync=null;setSync();render();});}
  if(a==="restart"){state.auth.step="email";state.auth.err="";render();}
  if(a==="clear"){state.log[s]={done:[],rpe:null,note:""};save(s);render();}
});
app.addEventListener("input",e=>{if(e.target.id==="note"){state.log[state.sel]={...entry(state.sel),note:e.target.value};save(state.sel);}});
app.addEventListener("focusout",e=>{if(e.target.id==="note")setTimeout(render,0);});
render();setSync();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
